apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
    scrape_configs:
      # One listener per runner scale set; they come and go with the scale set.
      - job_name: arc-listener
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [arc-systems] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            regex: runner-scale-set-listener
            action: keep
          - source_labels: [__address__]
            regex: (.+?)(?::\d+)?
            replacement: $1:8080
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      - job_name: arc-controller
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [arc-systems] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: gha-rs-controller
            action: keep
          - source_labels: [__address__]
            regex: (.+?)(?::\d+)?
            replacement: $1:8080
            target_label: __address__

      - job_name: registry
        static_configs:
          - targets: [mycr.registry.svc.cluster.local:5001]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        # prom/prometheus runs as nobody(65534); the local-path volume is
        # created root-owned, so the group must be set for it to be writable.
        fsGroup: 65534
      containers:
      - name: prometheus
        image: prom/prometheus:v3.7.3@sha256:49214755b6153f90a597adcbff0252cc61069f8ab69ce8411285cd4a560e8038
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=90d
        ports:
        - containerPort: 9090
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: data
          mountPath: /prometheus
      volumes:
      - name: config
        configMap:
          name: prometheus
      - name: data
        persistentVolumeClaim:
          claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  # ClusterIP only. Reach the UI with:
  #   kubectl port-forward -n monitoring svc/prometheus 9090:9090
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
