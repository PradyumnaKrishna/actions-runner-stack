# actions-cache-server.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: actions-cache-server
  namespace: actions-cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: actions-cache-server
  template:
    metadata:
      labels:
        app: actions-cache-server
    spec:
      containers:
      - name: cache-server
        image: ghcr.io/falcondev-oss/github-actions-cache-server:9.6.0@sha256:d96b430c33bf3e2e81c0e4a813ab5c9c2c057e33f63be53c8039e8ec4be53df2
        ports:
        - containerPort: 3000
        env:
        - name: API_BASE_URL
          # Must match the Service below exactly; a mismatch surfaces as
          # 404s on cache upload, not a connection error.
          value: http://actions-cache-server.actions-cache.svc.cluster.local
        volumeMounts:
        - name: cache-data
          mountPath: /app/.data
      volumes:
      - name: cache-data
        hostPath:
          path: /mnt/data/container/actions-cache
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: actions-cache-server
  namespace: actions-cache
spec:
  # ClusterIP: runner pods reach this over cluster DNS. Use NodePort or
  # LoadBalancer only if something outside the cluster needs it.
  selector:
    app: actions-cache-server
  ports:
  - port: 80
    targetPort: 3000
