# Values for the gha-runner-scale-set Helm chart (modern ARC).
githubConfigUrl: "https://github.com/ORG_OR_REPO"
githubConfigSecret: arc-github-auth

template:
  spec:

    initContainers:
      - name: init-dind-externals
        image: mycr.registry.svc.cluster.local/runner:latest # any registry the cluster can pull from
        command:
          ["cp", "-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
        volumeMounts:
          - name: dind-externals
            mountPath: /home/runner/tmpDir

    containers:
      - name: dind
        image: docker:28-dind@sha256:2a232a42256f70d78e3cc5d2b5d6b3276710a0de0596c145f627ecfae90282ac
        args:
          - dockerd
          - --host=unix:///var/run/docker.sock
          - --group=$(DOCKER_GROUP_GID)
          - --mtu=1300
        env:
          - name: DOCKER_GROUP_GID
            # Match the docker group inside the runner image (varies by base image).
            value: "123"
        securityContext:
          privileged: true
        startupProbe:
          exec: { command: ["docker", "info"] }
          initialDelaySeconds: 0
          failureThreshold: 24
          periodSeconds: 5
        volumeMounts:
          - name: dind-sock
            mountPath: /var/run
          - name: dind-externals
            mountPath: /home/runner/externals
          - name: dind-storage
            mountPath: /var/lib/docker
          # Optional: trust a registry with a private CA -- see docs/setup-registry.md
          # - name: registry-ca
          #   mountPath: /etc/docker/certs.d/mycr.registry.svc.cluster.local
          #   readOnly: true
          # Optional: registry auth for DinD pulls
          # - name: docker-secret
          #   mountPath: /root/.docker/config.json
          #   subPath: config.json
          #   readOnly: true

      - name: runner # must be exactly "runner"
        image: mycr.registry.svc.cluster.local/runner:latest # any registry the cluster can pull from
        command: ["/home/runner/run.sh"]
        env:
          - name: DOCKER_HOST
            value: unix:///var/run/docker.sock
          - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
            value: "120"
          # Optional: point to your actions cache server (results service).
          # Must match API_BASE_URL in k8s/cache-server/deployment.yaml.
          # - name: ACTIONS_RESULTS_URL
          #   value: "http://actions-cache-server.actions-cache.svc.cluster.local"
          # - name: CUSTOM_ACTIONS_RESULTS_URL
          #   value: "http://actions-cache-server.actions-cache.svc.cluster.local"
          - name: DOCKER_CONFIG
            value: /home/runner/.docker
        # Optional: only enable if your workflows need privileged operations.
        securityContext:
          privileged: true
        volumeMounts:
          - name: dind-sock
            mountPath: /var/run
          # Optional: registry auth for runner container
          # - name: docker-secret
          #   mountPath: /home/runner/.docker/config.json
          #   subPath: config.json
          #   readOnly: true

    volumes:
      - name: dind-sock
        emptyDir: {}
      - name: dind-externals
        emptyDir: {}
      - name: dind-storage
        emptyDir: {}
      # Optional: registry CA, paired with the mount above
      # - name: registry-ca
      #   secret:
      #     secretName: registry-ca
      #     items:
      #       - key: ca.crt
      #         path: ca.crt
      # Optional: registry auth for runner container
      # - name: docker-secret
      #   secret:
      #     secretName: dockerhub-config
      #     items:
      #       - key: .dockerconfigjson # key inside the Secret
      #         path: config.json
